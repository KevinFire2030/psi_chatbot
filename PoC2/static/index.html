<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GSCM PSI PoC2 — Hermes Webhook Chat</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="top-grid" aria-label="PSI PoC 소개와 예시 질문">
        <section class="hero-panel">
          <p class="eyebrow"><span class="dot"></span> PSI Natural Language PoC</p>
          <h1>GSCM PSI Chatbot</h1>
          <p class="hero-copy">
            GSCM PSI Excel 데이터를 DuckDB long-form 데이터마트로 변환한 뒤,
            자연어 질문으로 지역/법인/모델/월/분기 別 FP 매출, DP, RTF, 숏,
            셀아웃, WOS, 유통재고를 조회하는 PoC 데모
          </p>
          <div class="stats" aria-label="데이터마트 기준 정보">
            <div class="stat-card">
              <strong>W23_pre</strong>
              <span>기준 플랜</span>
            </div>
            <div class="stat-card">
              <strong>2.2M+</strong>
              <span>long-form rows</span>
            </div>
            <div class="stat-card">
              <strong>937</strong>
              <span>source columns</span>
            </div>
          </div>
        </section>

        <section class="example-panel" aria-label="예시 질문">
          <h2>예시 질문</h2>
          <div class="example-list">
            <button data-example="3분기 Short가 가장 큰 지역 Top 5 보여줘">3분기 Short가 가장 큰 지역 Top 5 보여줘</button>
            <button data-example="9월 WOS가 13 이상인 법인을 알려줘">9월 WOS가 13 이상인 법인을 알려줘</button>
            <button data-example="3분기 FP 금액기준 전년비 감소가 가징 큰 법인 탑5 알려줘">3분기 FP 금액기준 전년비 감소가 가징 큰 법인 탑5 알려줘</button>
            <button data-example="SEG 3분기 PSI 입력 현황 분석해서 입력이 덜됐거나 추가로 확인이 필요한 부분이 있는지 점검해줘">SEG 3분기 PSI 입력 현황 분석해서 입력이 덜됐거나 추가로 확인이 필요한 부분이 있는지 점검해줘</button>
            <button data-example="2분기 SEROM s26F 셀아웃 wos 알려줘">2분기 SEROM s26F 셀아웃 WOS 알려줘</button>
          </div>
        </section>
      </section>

      <section class="chat-card" aria-label="채팅 UI">
        <div id="messages" class="messages">
          <article class="message bot">
            <div class="avatar">H</div>
            <div class="bubble">
              안녕하세요. PSI 데이터를 자연어로 물어보세요.<br />
              예: <button class="link-button" data-example="3분기 Short가 가장 큰 지역 Top 5 보여줘">3분기 Short가 가장 큰 지역 Top 5 보여줘</button>
            </div>
          </article>
        </div>

        <form id="chatForm" class="composer">
          <input
            id="messageInput"
            name="message"
            autocomplete="off"
            placeholder="예: 3분기 Short가 가장 큰 지역 Top 5 보여줘"
            required
          />
          <button id="sendButton" type="submit">전송</button>
        </form>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
